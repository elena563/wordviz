[tool.poetry]
name = "wordviz"
version = "0.7.0"
description = "A lightweight Python package for loading, analyzing, and visualizing word embeddings."
authors = ["Elena Zen <elenazen563@gmail.com>"]
license = "MIT"
readme = "README.md"

include = [
    "images",
    "docs/example.ipynb",
]

[project]
name = "wordviz"
version = "0.7.0"
requires-python = ">=3.11,<3.14" 

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
matplotlib = ">=3.10.1,<4.0.0"
numpy = ">=1.18.5,<2.4"
gensim = ">=4.4.0,<5.0.0"
scipy = ">=1.14.1,<2.0.0"
scikit-learn = ">=1.6.1,<2.0.0"
plotly = ">=6.0.1,<7.0.0"
seaborn = ">=0.13.2,<0.14.0"
adjusttext = "^1.3.0"
tqdm = ">=4.60.0,<5.0.0"
umap-learn = ">=0.5.7,<0.6.0"
sentence-transformers = {version = ">=2.0.0", optional = true}
transformers = {version = ">=4.20.0", optional = true}
torch = {version = ">=1.12.0", optional = true}

[tool.poetry.extras]
encoding = ["sentence-transformers", "transformers", "torch"]
viz = ["umap-learn"]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
isort = "^6.0.1"
sphinx = "^8.2.3"
mypy = "^2.3.1"
pandas-stubs = "*"
types-seaborn = "*"
types-tqdm = "*"
scipy-stubs = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"] 
ignore = ["E501"]                

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = ["slow: tests that download/load large pretrained models"]
addopts = "-m 'not slow'"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["docs/", "source/"]

[[tool.mypy.overrides]]
module = [
    "transformers",
    "transformers.*",
    "sklearn",
    "sklearn.*",
    "gensim",
    "gensim.*",
    "adjustText",
    "umap",
    "umap.*",
    "plotly",
    "plotly.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false